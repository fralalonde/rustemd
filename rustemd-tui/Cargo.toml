[package]
name = "rustemd-tui"
version = "0.1.1"
edition = "2024"
description = "Terminal UI client for a running rustemd unit manager."
license = "MIT"
repository = "https://github.com/fralalonde/rustemd"
homepage = "https://github.com/fralalonde/rustemd"
rust-version = "1.89"

[dependencies]
rustemd = { path = "../rustemd" }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
