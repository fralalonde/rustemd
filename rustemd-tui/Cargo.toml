[package]
name = "rustemd-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI client for a running rustemd unit manager."
license = "MIT"
rust-version = "1.85"

[dependencies]
rustemd = { path = "../rustemd" }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
