[package]
name = "rustemd"
version = "0.1.0"
edition = "2024"
description = "A systemd init reimplementation in Rust: a drop-in systemctl replacement with unit files, user services, and timers."
license = "MIT"
rust-version = "1.85"

[features]
default = ["socket", "udev"]
# Linux PID-1 boot support: mount the API/virtual filesystems, run early-boot
# configuration, and instantiate template units (getty@tty1 -> getty@.service).
boot = []
# Socket activation: `.socket` units that bind listening sockets and activate a
# matching `.service` on the first connection (inetd-style, via LISTEN_FDS).
socket = []
# udev integration: discover kernel devices (sysfs + netlink uevents) and track
# them as runtime-generated `.device` units. Linux-only; no new dependencies —
# built on `nix` netlink sockets and the sysfs tree. Disable for headless /
# non-Linux builds that don't need device ordering.
udev = []

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus (Linux only): pure-Rust, no C dependency. `blocking-api` runs the
# async machinery on internal threads, so the synchronous poll loop never
# does async work; `async-io` is the executor backend the blocking API uses.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_complete_nushell = "4.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
nix = { version = "0.31.3", features = ["process", "signal", "fs", "user", "resource", "socket", "poll", "hostname"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "rustemd"
path = "src/main.rs"
