name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # e.g. "v0.2.0" — scripts strip the leading 'v' for package versions.
  VERSION: ${{ github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # dbus-daemon, for the D-Bus integration test (tests/dbus.rs).
      - run: sudo apt-get update && sudo apt-get install -y dbus
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace
      # Privileged tests (User= privilege dropping, PrivateTmp= mount
      # namespaces) self-skip when not root. Build them, then run the prebuilt
      # binary as real root: setuid to an unmapped uid needs real root — an
      # unprivileged `unshare -U -r` maps only uid 0, so `sudo`, not a user
      # namespace, is what can exercise both paths. Running the binary directly
      # (not `sudo cargo`) avoids root-owned build artifacts and sudo's
      # secure_path resetting the cargo/rustup locations.
      - run: cargo test -p rustemd --test privileged --no-run
      - run: sudo "$(find target/debug/deps -maxdepth 1 -name 'privileged-*' -type f -executable -print -quit)"

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: cargo build --release --locked --target ${{ matrix.target }} --features boot
      - run: bash scripts/package-linux.sh ${{ matrix.target }} "${VERSION#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pin the declared workspace MSRV so stable upgrades cannot hide a
      # newer language or standard-library requirement.
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Lint native Windows workspace at MSRV
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test native Windows workspace at MSRV
        run: cargo test --workspace --locked
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package zip + msi
        shell: pwsh
        run: |
          $ver = $env:VERSION.TrimStart('v')
          $bin = "target/x86_64-pc-windows-msvc/release"
          New-Item -ItemType Directory -Force dist | Out-Null

          # Portable zip.
          $stage = "dist/rustemd-$ver-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$bin/rustemd.exe" $stage
          Copy-Item "$bin/rustemctl.exe" $stage
          Copy-Item "$bin/rustemd-tui.exe" $stage
          Set-Content -Path "$stage/VERSION.txt" -Value $ver
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/rustemd-$ver-x86_64-pc-windows-msvc.zip"

          # MSI via WiX 4 (.NET tool). Build from the bin dir so relative
          # Source= paths in the .wxs resolve against the .exe files.
          dotnet tool install --global wix
          Copy-Item packaging/windows/rustemd.wxs $bin/
          Push-Location $bin
          wix build -d Version=$ver rustemd.wxs -o "rustemd-$ver-x86_64.msi"
          Pop-Location
          Move-Item "$bin/rustemd-$ver-x86_64.msi" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.msi

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Package tar.gz + dmg
        shell: bash
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          bin="target/aarch64-apple-darwin/release"
          mkdir -p dist

          # Portable tar.gz.
          stage="dist/rustemd-$ver-aarch64-apple-darwin"
          mkdir -p "$stage/bin" "$stage/completions"
          install -m 0755 "$bin/rustemd"     "$stage/bin/rustemd"
          install -m 0755 "$bin/rustemctl"   "$stage/bin/rustemctl"
          install -m 0755 "$bin/rustemd-tui" "$stage/bin/rustemd-tui"
          "$bin/rustemctl" completions bash       > "$stage/completions/rustemctl.bash"
          "$bin/rustemctl" completions zsh        > "$stage/completions/_rustemctl"
          "$bin/rustemctl" completions fish       > "$stage/completions/rustemctl.fish"
          printf '%s\n' "$ver" > "$stage/VERSION"
          tar -C dist -czf "dist/rustemd-$ver-aarch64-apple-darwin.tar.gz" "rustemd-$ver-aarch64-apple-darwin"

          # Disk image (drag the binaries to /usr/local/bin).
          dmgroot="$(mktemp -d)"
          mkdir -p "$dmgroot/rustemd"
          install -m 0755 "$bin/rustemd"     "$dmgroot/rustemd/rustemd"
          install -m 0755 "$bin/rustemctl"   "$dmgroot/rustemd/rustemctl"
          install -m 0755 "$bin/rustemd-tui" "$dmgroot/rustemd/rustemd-tui"
          printf 'Copy rustemd, rustemctl and rustemd-tui to /usr/local/bin.\n' > "$dmgroot/rustemd/README.txt"
          hdiutil create -volname "rustemd $ver" -srcfolder "$dmgroot/rustemd" \
              -ov -format UDZO "dist/rustemd-$ver-aarch64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.tar.gz
            dist/*.dmg

  release:
    needs: [test, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
