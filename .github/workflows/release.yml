name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # e.g. "v0.2.0" — scripts strip the leading 'v' for package versions.
  VERSION: ${{ github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # dbus-daemon, for the D-Bus integration test (tests/dbus.rs).
      - run: sudo apt-get update && sudo apt-get install -y dbus
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace
      # Privileged tests (User= privilege dropping, PrivateTmp= mount
      # namespaces) self-skip when not root. Build them, then run the prebuilt
      # binary as real root: setuid to an unmapped uid needs real root — an
      # unprivileged `unshare -U -r` maps only uid 0, so `sudo`, not a user
      # namespace, is what can exercise both paths. Running the binary directly
      # (not `sudo cargo`) avoids root-owned build artifacts and sudo's
      # secure_path resetting the cargo/rustup locations.
      - run: cargo test -p rustemd --test privileged --no-run
      - run: sudo "$(find target/debug/deps -maxdepth 1 -name 'privileged-*' -type f -executable -print -quit)"

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: cargo build --release --locked --target ${{ matrix.target }} --features boot
      - run: bash scripts/package-linux.sh ${{ matrix.target }} "${VERSION#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pin the declared workspace MSRV so stable upgrades cannot hide a
      # newer language or standard-library requirement. rustup does not
      # install clippy for a pinned toolchain by default, so add the component.
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint native Windows workspace at MSRV
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test native Windows workspace at MSRV
        run: cargo test --workspace --locked
      - run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Package zip + msi
        shell: pwsh
        run: |
          $ver = $env:VERSION.TrimStart('v')
          $bin = "target/x86_64-pc-windows-msvc/release"
          New-Item -ItemType Directory -Force dist | Out-Null

          # Portable zip.
          $stage = "dist/rustemd-$ver-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$bin/rustemd.exe" $stage
          Copy-Item "$bin/rustemctl.exe" $stage
          Copy-Item "$bin/rustemd-tui.exe" $stage
          Set-Content -Path "$stage/VERSION.txt" -Value $ver
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/rustemd-$ver-x86_64-pc-windows-msvc.zip"

          # MSI via WiX 4 (.NET tool). Build from the bin dir so relative
          # Source= paths in the .wxs resolve against the .exe files.
          dotnet tool install --global wix
          Copy-Item packaging/windows/rustemd.wxs $bin/
          Push-Location $bin
          wix build -d Version=$ver rustemd.wxs -o "rustemd-$ver-x86_64.msi"
          Pop-Location
          Move-Item "$bin/rustemd-$ver-x86_64.msi" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.msi

  # NOTE: there is no macOS release job. rustemd is a systemd reimplementation
  # and its manager is Linux-native (cgroups v2, netlink/udev, system D-Bus,
  # signalfd); a macOS build was never validated and does not compile. Windows
  # is supported for the CLI/daemon compatibility port (Job Objects, named
  # pipes, SCM). If a real macOS port is ever wanted, it is a separate effort.

  release:
    needs: [test, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
