<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="rystemd logo">
  <defs>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8c3b"/>
      <stop offset="1" stop-color="#e2501f"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="51" fill="none" stroke="#2a3342" stroke-width="3"/>

  <!-- gear teeth (8) -->
  <g fill="url(#rust)">
    <rect x="42" y="112" width="36" height="32" rx="10" transform="rotate(0 128 128)"/>
    <rect x="42" y="112" width="36" height="32" rx="10" transform="rotate(45 128 128)"/>
    <rect x="42" y="112" width="36" height="32" rx="10" transform="rotate(90 128 128)"/>
    <rect x="42" y="112" width="36" height="32" rx="10" transform="rotate(135 128 128)"/>
    <rect x="42" y="112" width="36" height="32" rx="10" transform="rotate(180 128 128)"/>
    <rect x="42" y="112" width="36" height="32" rx="10" transform="rotate(225 128 128)"/>
    <rect x="42" y="112" width="36" height="32" rx="10" transform="rotate(270 128 128)"/>
    <rect x="42" y="112" width="36" height="32" rx="10" transform="rotate(315 128 128)"/>
    <circle cx="128" cy="128" r="74" fill="url(#rust)"/>
    <circle cx="128" cy="128" r="52" fill="#10151d"/>
    <!-- center hub -->
    <circle cx="128" cy="128" r="20" fill="#ffd9b3"/>
    <circle cx="128" cy="128" r="9" fill="url(#rust)"/>
  </g>
</svg>